<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Re-track · pantalla de nueva lección (IA) · cuatro propuestas (segunda ronda, con aire)</title>
<!-- Segunda ronda (2026-11-24): la primera se descartó por apretada. Regla: una sola decisión por pantalla, letra grande,
     separar con espacio. Parte del esquema de Matthieu del 2026-11-03 (docs/DESIGN.md, «Visión ampliada»).
     Ventana real: 460×460. Las canciones y los pasos son de muestra. -->
<link rel="stylesheet" href="../propuestas.css">
<style>
  .aire { position: absolute; inset: 58px 28px 36px; display: flex; flex-direction: column; }
  .fila { display: flex; align-items: center; gap: 14px; }
  .gr { flex: 1; min-width: 0; }
  .suave { font-size: 17px; color: var(--tenue); line-height: 1.3; }
  .cta.gr2 { padding: 11px 20px; font-size: 16px; }
  .grande { font: 700 34px/1.1 Rajdhani; color: #fff; }
  .abajo { margin-top: auto; margin-bottom: 8px; }

  .a-zona { flex: 1; margin: 14px 0 22px; border: 2px dashed #3a3a44; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .a-zona .hex { width: 64px; height: 64px; font-size: 26px; margin-bottom: 8px; }

  .b-hexes { display: flex; gap: 22px; margin-top: 30px; }
  .b-hexes > div { width: 96px; text-align: center; line-height: 1.2; }
  .b-hexes .hex { width: 68px; height: 68px; margin: 0 auto 10px; font-size: 20px; }
  .b-hexes b { display: block; font: 700 17px Rajdhani; letter-spacing: .08em; color: #fff; }
  .via { position: relative; height: 8px; background: var(--hueco); margin: 10px 0 0; }
  .via i { position: absolute; top: -7px; left: 0; width: 12px; height: 22px; background: var(--amarillo); }

  .c-linea { margin-top: 30px; padding-bottom: 12px; border-bottom: 2px solid var(--amarillo); font: 600 24px/1.3 Rajdhani; color: #fff; }
  .cursor { display: inline-block; width: 10px; height: 22px; background: var(--rojo); vertical-align: -3px; margin-left: 4px; }

  .d-dos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 30px 0 14px; flex: 1; }
  .d-dos > div { padding: 24px 18px; background: var(--panel); clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); }
  .d-dos .hex { width: 56px; height: 56px; font-size: 20px; margin-bottom: 22px; }
  .d-dos b { display: block; font: 700 24px/1.1 Rajdhani; color: #fff; margin-bottom: 8px; }
</style>
</head>
<body>
<script>
const cab = `<div class="cab"><span class="logo">RE-TRACK</span><span class="ruta">← Lecciones</span>
  <span class="vent">―</span><span class="vent">✕</span></div><div class="glitch"></div>`;
const pie = `<div class="pie"><span class="am">■ Live conectado</span></div>`;
const celda = (letra, nombre, idea, html) =>
  `<div class="celda"><h2>${letra} · ${nombre}<small>${idea}</small></h2><div class="app">${cab}<div class="aire">${html}</div>${pie}</div></div>`;

// A · Soltar: toda la pantalla es el sitio donde cae la canción.
const A = `<div class="a-zona"><span class="hex bl">+</span><span class="grande">Suelta una canción</span><span class="suave">mp3 o wav</span></div>
  <div class="fila" style="margin-bottom:8px"><span class="suave gr">o combina piezas de las lecciones</span><span class="et bl">A la carta ▸</span></div>`;

// B · Piezas: tres huecos grandes y el deslizador.
const PIEZAS = [["BASS", "Jungle", 8], ["DRUMS", "Around the World", 6], ["PAD", null]];
const pasos = PIEZAS.reduce((s, p) => s + (p[2] ?? 0), 0);
const B = `<span class="grande" style="margin-top:8px">Elige las piezas</span>
  <div class="b-hexes">${PIEZAS.map(([papel, de]) => `<div><span class="hex ${de ? "on" : "bl"}">${de ? "■" : "+"}</span><b>${papel}</b><span class="te">${de ?? "vacío"}</span></div>`).join("")}</div>
  <div style="margin-top:30px"><div class="fila"><span class="et bl gr">■ Una detrás de otra</span><span class="et">Mezcladas</span></div><div class="via"><i></i></div></div>
  <div class="fila abajo"><span class="suave gr num">${pasos} pasos</span><span class="cta gr2">Generar ▸</span></div>`;

// C · Pedirlo: una pregunta y una línea para escribir.
const C = `<span class="grande" style="margin-top:8px">¿Qué se quiere aprender?</span>
  <div class="c-linea">El bass de Jungle con los drums de Around the World<span class="cursor"></span></div>
  <span class="suave" style="margin-top:16px">También vale soltar aquí una canción.</span>
  <div class="fila abajo"><span class="gr"></span><span class="cta gr2">Generar ▸</span></div>`;

// D · Dos caminos: primero se elige cuál; cada uno tiene luego su pantalla.
const D = `<span class="grande" style="margin-top:8px">Nueva lección</span>
  <div class="d-dos"><div><span class="hex sig">▸</span><b>De una canción</b><span class="suave">Se sube y sale su lección entera.</span></div>
    <div><span class="hex on">■</span><b>A la carta</b><span class="suave">Piezas de varias lecciones.</span></div></div>`;

document.body.innerHTML = celda("A", "SOLTAR", "la pantalla entera recibe la canción", A) + celda("B", "PIEZAS", "tres huecos y un deslizador", B) +
  celda("C", "PEDIRLO", "una pregunta, una línea", C) + celda("D", "DOS CAMINOS", "primero se elige cuál", D);
console.assert(pasos === 14, "8 + 6 pasos");
</script>
</body>
</html>
