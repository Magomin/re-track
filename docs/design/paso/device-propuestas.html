<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Re-track · paso «device en la pista» · tres propuestas</title>
<!-- Tres propuestas para el espejo del paso device_en_pista (2026-11-24): la versión con tres números no dejaba claro
     dónde se suelta el device. Paso: Jungle / Pad 03/10. Ventana real: 460×460. Tokens: panel/panel.css. -->
<style>
  @font-face { font-family: Rajdhani; font-weight: 500; src: url(../../../panel/fonts/Rajdhani-Medium.ttf); }
  @font-face { font-family: Rajdhani; font-weight: 600; src: url(../../../panel/fonts/Rajdhani-SemiBold.ttf); }
  @font-face { font-family: Rajdhani; font-weight: 700; src: url(../../../panel/fonts/Rajdhani-Bold.ttf); }
  :root { --negro: #08080a; --panel: #111114; --linea: #26262c; --hueco: #24242a; --pieza: #2b2b32;
    --amarillo: #fcee0a; --rojo: #ff2a3d; --magenta: #ff2fb0; --cian: #00e5ff; --texto: #c9c9cf; --tenue: #6c6c78; }
  body { margin: 0; padding: 24px; background: #1d1d23; font: 500 15px Rajdhani, sans-serif; color: var(--texto);
    display: grid; grid-template-columns: repeat(3, 460px); gap: 12px 32px; width: max-content; }
  h2 { margin: 0; font: 700 26px Rajdhani; color: var(--amarillo); letter-spacing: .04em; }
  h2 small { display: block; font: 500 16px/1.2 Rajdhani; color: #b4b4c0; letter-spacing: 0; height: 40px; }
  .app { position: relative; width: 460px; height: 460px; box-sizing: border-box; padding: 14px 16px 0; overflow: hidden;
    background: var(--negro); border-top: 2px solid var(--amarillo); }
  .app::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
  .cab { display: flex; align-items: center; gap: 4px; }
  .logo { position: relative; font: 700 26px/1 Rajdhani; letter-spacing: .04em; color: var(--amarillo);
    transform: skewX(-12deg); text-shadow: -2px 0 var(--rojo), 2px 0 var(--cian); }
  .logo::after { content: "RE-TRACK"; position: absolute; left: 0; top: 0; clip-path: inset(52% 0 30% 0);
    transform: translateX(5px); text-shadow: -2px 0 var(--magenta); }
  .ruta { flex: 1; text-align: right; margin-right: 10px; }
  .et, .ruta { font: 600 12px Rajdhani; letter-spacing: .18em; text-transform: uppercase; color: var(--tenue); }
  .vent { color: var(--tenue); font-size: 12px; width: 26px; text-align: center; }
  .glitch { height: 2px; margin: 10px 0 12px;
    background: linear-gradient(90deg, var(--magenta) 0 12%, transparent 12% 14%, var(--magenta) 14% 17%, transparent 17%); }
  .pie { position: absolute; left: 16px; right: 16px; bottom: 10px; display: flex; justify-content: space-between;
    font: 600 12px Rajdhani; letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); }
  .am { color: var(--amarillo); } .ro { color: var(--rojo); }
  .bot { padding: 3px 10px; background: var(--panel); border: 1px solid var(--linea); font: 600 13px Rajdhani; letter-spacing: .08em; text-transform: uppercase; }
  .nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .tramos { flex: 1; display: flex; gap: 3px; align-items: center; }
  .tramos i { flex: 1; height: 6px; background: var(--hueco); }
  .tramos i.on { background: var(--amarillo); } .tramos i.sig { background: var(--rojo); height: 10px; }
  .titulo { display: block; margin: 1px 0 10px; font: 600 24px/1.1 Rajdhani; color: #fff; }
  .porque { margin: 10px 0 0; font-size: 15px; line-height: 1.3; color: #9a9aa6; border-left: 2px solid var(--magenta); padding-left: 10px; }
  .espejo { position: relative; padding: 28px 10px 10px; background: #131317; border-left: 2px solid var(--amarillo);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
  .zona { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; font: 600 11px Rajdhani; letter-spacing: .16em; text-transform: uppercase; color: var(--tenue); }
  .zona b { padding: 2px 8px 2px 6px; background: var(--amarillo); color: var(--negro); font-weight: 700; letter-spacing: .1em;
    clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .pieza { padding: 3px 6px; background: var(--pieza); font: 600 12px Rajdhani; color: #9a9aa6; text-align: center; white-space: nowrap; }
  .aqui { background: var(--negro); color: #fff; outline: 2px solid var(--rojo); outline-offset: 1px; }
  .falta { background: none; color: var(--amarillo); outline: 2px dashed var(--rojo); outline-offset: 1px; }
  .n { display: inline-block; width: 15px; margin-right: 5px; background: var(--rojo); color: #fff; font: 700 12px/15px Rajdhani; text-align: center; }
  .gesto { margin-top: 3px; font: 700 14px/1.2 Rajdhani; letter-spacing: .05em; text-transform: uppercase; color: var(--rojo); }
  .gesto b { color: var(--amarillo); }
  .fila { display: flex; gap: 4px; }
  .mini { font-size: 9px !important; letter-spacing: .14em; }

  /* A · Mapa de Live: la ventana de Ableton en miniatura, cada zona en su sitio de verdad. */
  .mapa { position: relative; display: grid; grid-template-columns: 104px 1fr; grid-template-rows: 9px 62px 62px; gap: 4px; }
  .mapa > div { background: #1a1a1f; padding: 4px 5px; overflow: hidden; }
  .mapa .control { grid-column: 1 / 3; padding: 0; background: #26262c; }
  .mapa .nave { grid-row: 2 / 4; }
  .mapa .nave span { display: block; padding: 1px 4px; font: 600 12px Rajdhani; color: #8a8a96; }
  .mapa .nave .aqui { margin: 3px 0; color: var(--amarillo); }
  .mapa .fila .pieza { flex: 1; }
  .mapa .huecos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 3px; }
  .mapa .huecos i { height: 8px; background: #202026; }
  .mapa .abajo .falta { display: block; margin-top: 5px; padding: 8px 6px; }
  .mapa svg { position: absolute; inset: 0; pointer-events: none; }

  /* B · Tres viñetas: un gesto por viñeta, de izquierda a derecha. */
  .tira { display: grid; grid-template-columns: 1fr 12px 1fr 12px 1fr; align-items: stretch; }
  .tira .sep { display: grid; place-items: center; color: var(--rojo); font-size: 12px; }
  .vin { background: #1a1a1f; padding: 6px 6px 8px; }
  .vin h3 { margin: 0 0 7px; font: 700 13px Rajdhani; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
  .vin .dib { height: 74px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .vin .dib span.txt { font: 600 12px Rajdhani; color: #8a8a96; padding-left: 4px; }
  .vin p { margin: 7px 0 0; font: 600 13px/1.2 Rajdhani; color: var(--texto); }
  .vin p b { color: var(--amarillo); font-weight: 600; }

  /* C · El arrastre en grande: dónde está la zona de devices y qué se suelta en ella. */
  .arrastre { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: center; }
  .silueta { display: grid; grid-template-columns: 18px 1fr; grid-template-rows: 5px 34px 20px; gap: 2px; }
  .silueta i { background: #26262c; } .silueta .c { grid-column: 1 / 3; } .silueta .b { grid-row: 2 / 4; }
  .silueta .d { background: none; outline: 2px solid var(--amarillo); outline-offset: -1px; }
  .zonad { position: relative; background: #1a1a1f; padding: 6px 8px 10px; }
  .zonad .falta { display: block; margin-top: 8px; padding: 16px 8px; font-size: 14px; }
  .fantasma { position: absolute; left: -34px; top: 30px; padding: 4px 10px; background: var(--amarillo); color: var(--negro); font: 700 13px Rajdhani;
    transform: rotate(-6deg); box-shadow: -3px 3px 0 var(--magenta); }
</style>
</head>
<body>
<script>
const marco = (cuerpo) => `<div class="app">
  <div class="cab"><span class="logo">RE-TRACK</span><span class="ruta">Jungle // Pad · 03/10</span><span class="vent">―</span><span class="vent">✕</span></div>
  <div class="glitch"></div>
  <div class="nav"><span class="bot">← Módulos</span><div class="tramos"><i class="on"></i><i class="on"></i><i class="sig"></i>${"<i></i>".repeat(7)}</div><span class="bot">Reiniciar</span></div>
  <span class="et ro">▸ Haz esto en Live</span><span class="titulo"><span class="am">Operator</span> en la pista PAD</span>
  ${cuerpo}
  <p class="porque">El pad medido es casi senoidal (h2 −10 dB, h3 −17 dB): senos de Operator, no sierras.</p>
  <div class="pie"><span class="am">■ Live conectado</span><span>Pad 2/10</span></div></div>`;
const n = (i) => `<em class="n" style="font-style:normal">${i}</em>`;
const GESTOS = `<div class="gesto" style="margin-top:9px">${n(1)}Clic en la pista <b>PAD</b></div>
  <div class="gesto">${n(2)}Busca <b>Operator</b> en el navegador (Ctrl+Alt+B)</div>
  <div class="gesto">${n(3)}Arrástralo <b>abajo del todo</b>, a la zona de devices</div>`;

const A = `<div class="espejo"><span class="zona"><b>Live</b>Tu ventana de Ableton, en pequeño</span>
  <div class="mapa">
    <div class="control"></div>
    <div class="nave"><span class="et mini">Navegador</span><span>Electric</span><span class="aqui">${n(2)}Operator</span><span>Sampler</span><span>Wavetable</span></div>
    <div><span class="et mini">Pistas</span><div class="fila" style="margin-top:3px"><span class="pieza aqui">${n(1)}PAD</span><span class="pieza">2-MIDI</span><span class="pieza">3-Audio</span><span class="pieza">4-Audio</span></div>
      <div class="huecos">${"<i></i>".repeat(8)}</div></div>
    <div class="abajo"><span class="et mini">Devices de PAD · abajo del todo</span><span class="pieza falta">${n(3)}Drop an Instrument or Sample Here</span></div>
    <svg viewBox="0 0 406 141"><path d="M 92 62 C 130 62, 110 118, 150 118" fill="none" stroke="#ff2a3d" stroke-width="2" stroke-dasharray="5 4"/>
      <path d="M 143 112 L 152 118 L 143 124" fill="none" stroke="#ff2a3d" stroke-width="2"/></svg>
  </div>${GESTOS}</div>`;

const B = `<div class="espejo"><span class="zona"><b>Live</b>Tres gestos, en este orden</span>
  <div class="tira">
    <div class="vin"><h3>${n(1)}La pista</h3><div class="dib"><div class="fila"><span class="pieza aqui" style="flex:1">PAD</span><span class="pieza" style="flex:1">2-MIDI</span></div><span class="txt">arriba, su nombre</span></div><p>Clic en <b>PAD</b></p></div>
    <div class="sep">▸</div>
    <div class="vin"><h3>${n(2)}El device</h3><div class="dib"><span class="txt">Electric</span><span class="pieza aqui" style="color:var(--amarillo);text-align:left">Operator</span><span class="txt">Sampler</span></div><p>Navegador, <b>Operator</b></p></div>
    <div class="sep">▸</div>
    <div class="vin"><h3>${n(3)}Suéltalo</h3><div class="dib"><span class="pieza falta" style="white-space:normal;padding:10px 4px">Drop an Instrument or Sample Here</span></div><p>Abajo del todo, <b>aquí</b></p></div>
  </div></div>`;

const C = `<div class="espejo"><span class="zona"><b>Live</b>La zona de devices · abajo del todo</span>
  <div class="arrastre">
    <div><div class="silueta"><i class="c"></i><i class="b"></i><i></i><i class="d"></i></div><span class="et mini" style="display:block;margin-top:5px;text-align:center">está aquí</span></div>
    <div class="zonad"><span class="et mini">Pista PAD seleccionada</span><span class="pieza falta">Drop an Instrument or Sample Here</span><span class="fantasma">Operator ▸</span></div>
  </div>${GESTOS}</div>`;

const cab = (letra, nombre, idea) => `<h2>${letra} · ${nombre}<small>${idea}</small></h2>`;
document.body.innerHTML =
  cab("A", "Mapa de Live", "Tu ventana de Ableton en miniatura: cada zona donde está de verdad, y una flecha del device a su destino.") +
  cab("B", "Tres viñetas", "Un gesto por viñeta, de izquierda a derecha, cada una con su dibujo y su frase.") +
  cab("C", "El arrastre en grande", "Solo el momento difícil: dónde está la zona de devices y qué se suelta en ella.") +
  marco(A) + marco(B) + marco(C);
</script>
</body>
</html>
