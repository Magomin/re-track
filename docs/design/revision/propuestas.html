<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Re-track · pantalla de revisión (comentar lo que genera la IA) · cuatro propuestas</title>
<!-- 2026-11-24. La pantalla que sigue a «Generar»: se ven las piezas que la IA está generando y se corrigen con comentarios
     pegados a una pieza. Corregir crea una versión nueva (v2) sin borrar la anterior (docs/DESIGN.md, «Visión ampliada»:
     feedback referenciado y versiones de módulo). Ventana real: 460×460. Piezas, pasos y comentarios son de muestra. -->
<link rel="stylesheet" href="../propuestas.css">
<style>
  .aire { position: absolute; inset: 54px 20px 32px; display: flex; flex-direction: column; }
  .fila { display: flex; align-items: center; gap: 14px; }
  .gr { flex: 1; min-width: 0; }
  .suave { font-size: 16px; color: var(--tenue); line-height: 1.25; }
  .abajo { margin-top: auto; }
  .papel { font: 700 19px/1.1 Rajdhani; letter-spacing: .08em; color: #fff; display: block; }
  .est { font: 700 15px Rajdhani; }
  .linea { padding: 6px 0 9px; border-bottom: 2px solid var(--amarillo); font: 600 19px/1.25 Rajdhani; color: #fff; }
  .cursor { display: inline-block; width: 8px; height: 18px; background: var(--rojo); vertical-align: -3px; margin-left: 3px; }
  .chip { display: inline-block; margin-left: 6px; padding: 3px 10px; background: var(--hueco); font: 600 14px Rajdhani; color: #fff; }
  .chip.on { background: var(--amarillo); color: #08080a; }

  .a-pieza { height: 62px; padding: 0 10px; margin-bottom: 6px; border-left: 2px solid transparent; }
  .a-pieza.on { background: var(--panel); border-left-color: var(--amarillo); }

  .b-dicho { align-self: flex-end; max-width: 300px; margin-top: 12px; padding: 8px 12px; background: var(--panel); font: 600 16px/1.25 Rajdhani; color: #fff; }
  .b-hecho { margin-top: 8px; }

  .c-paso { height: 36px; gap: 10px; font: 600 16px Rajdhani; color: var(--texto); }
  .c-paso .num { width: 16px; color: var(--tenue); }
  .c-paso.on { color: #fff; }
  .c-nota { margin: 0 0 6px 26px; padding: 6px 12px; border-left: 2px solid var(--rojo); background: var(--panel); font: 600 16px Rajdhani; color: #fff; }

  .d-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .d-cols > div { padding: 10px 12px; background: var(--panel); font: 600 15px/1.2 Rajdhani; }
  .d-cols p { margin: 10px 0 0; color: var(--tenue); }
  .d-cols p.cambia { color: #fff; }
  .d-cols p.antes { text-decoration: line-through; }
</style>
</head>
<body>
<script src="../propuestas.js"></script>
<script>
const [J, W] = L;
const DICHO = "El ataque es más corto, casi un clic";
const PASOS = ["Crear la pista BASS", "Cargar Operator", "Ae Attack a 5 ms", "Osc-B Level a −12 dB", "Escribir las notas", "Glide On"];
const ruta = "← Nueva lección";

// A · Lista y caja: las piezas con su estado; se toca una y se le escribe el comentario abajo.
const A = `<div class="fila a-pieza on">${car(J, 46)}<span class="gr"><span class="papel">BASS</span><span class="suave">Jungle · v1 · 8 pasos</span></span><span class="est am">■ Lista</span></div>
  <div class="fila a-pieza">${car(W, 46)}<span class="gr"><span class="papel">DRUMS</span><span class="suave">Around the World</span></span><span class="est ro num">▸ Generando 60 %</span></div>
  <span class="et" style="margin-top:14px">Comentario para BASS</span><div class="linea">${DICHO}<span class="cursor"></span></div>
  <span class="suave" style="margin-top:10px">Regenerar crea la v2; la v1 se guarda.</span>
  <div class="fila abajo"><span class="sec">▸ Escuchar</span><span class="gr"></span><span class="cta">Regenerar BASS ▸</span></div>`;

// B · Conversación: una pieza cada vez, con el hilo de lo que se le ha pedido y lo que cambió.
const B = `<div class="fila">${car(J, 56)}<span class="gr"><span class="papel" style="font-size:24px">BASS</span><span class="suave">Jungle</span></span><span><span class="chip">v1</span><span class="chip on">■ v2</span></span></div>
  <div class="b-dicho">${DICHO}</div><span class="est am b-hecho">■ v2 lista · cambian 3 pasos de 8</span>
  <div class="b-dicho">Y una octava más abajo</div><span class="est ro b-hecho">▸ Generando la v3…</span>
  <div class="fila abajo"><span class="gr linea te" style="border-color:var(--linea)">Escribir un comentario…</span><span class="sec">Enviar ▸</span></div>`;

// C · Paso a paso: se ven los pasos de la pieza y el comentario se pega al paso que falla.
const C = `<div class="fila" style="margin-bottom:6px"><span class="gr"><span class="papel">BASS · v1</span></span><span class="suave">Jungle</span></div>
  ${PASOS.map((p, i) => `<div class="fila c-paso ${i === 2 ? "on" : ""}"><span class="num">${i + 1}</span><span class="gr">${p}</span>${i === 2 ? `<span class="est ro">▸ 1 comentario</span>` : ""}</div>${i === 2 ? `<div class="c-nota">«${DICHO}»</div>` : ""}`).join("")}
  <div class="fila abajo"><span class="suave gr">Tocar un paso para comentarlo</span><span class="cta">Regenerar ▸</span></div>`;

// D · Antes y después: tras regenerar, las dos versiones lado a lado con lo que cambió, y se elige con cuál quedarse.
const D = `<span class="et">Comentario sobre BASS · Jungle</span><div style="font:600 20px/1.25 Rajdhani;color:#fff;margin-top:6px">«${DICHO}»</div>
  <div class="d-cols"><div><span class="et">v1</span><p>Cargar Operator</p><p class="cambia antes">Ae Attack a 5 ms</p><p>Osc-B Level a −12 dB</p><p class="cambia antes">Ae Decay a 600 ms</p></div>
    <div><span class="et am">■ v2</span><p>Cargar Operator</p><p class="cambia am">■ Ae Attack a 0 ms</p><p>Osc-B Level a −12 dB</p><p class="cambia am">■ Ae Decay a 180 ms</p></div></div>
  <div class="fila abajo" style="gap:8px"><span class="sec">Volver a v1</span><span class="sec">▸ Oír</span><span class="gr"></span><span class="cta">Quedarse con v2 ▸</span></div>`;

document.body.innerHTML = celda("A", "LISTA Y CAJA", "se toca una pieza y se le escribe", A, ruta) + celda("B", "CONVERSACIÓN", "el hilo de una pieza y sus versiones", B, ruta) +
  celda("C", "PASO A PASO", "el comentario se pega al paso que falla", C, ruta) + celda("D", "ANTES Y DESPUÉS", "las dos versiones, y se elige", D, ruta);
</script>
</body>
</html>
