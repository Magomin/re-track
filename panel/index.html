<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Re-track</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <!-- Barra de título propia (decorations: false): se arrastra desde aquí -->
  <div class="cab" data-tauri-drag-region>
    <span class="logo" data-t="RE-TRACK" data-tauri-drag-region>RE-TRACK</span>
    <span id="ruta" data-tauri-drag-region></span>
    <label class="elegir"><select id="leccion" aria-label="Lección"></select></label>
    <button id="minimizar" class="ventana" aria-label="Minimizar" title="Minimizar">―</button>
    <button id="cerrar" class="ventana" aria-label="Cerrar" title="Cerrar">✕</button>
  </div>
  <div class="glitch"></div>

  <div id="vista-modulos">
    <div class="stats">
      <div><span class="et" id="avance-de"></span><b id="avance"></b></div>
    </div>
    <div id="mapa"></div>
    <div id="siguiente" class="sig-caja"></div>
  </div>

  <div id="vista-paso" hidden>
    <div class="barra-nav">
      <button id="volver">← Módulos</button>
      <div id="tramos" class="tramos"></div>
      <button id="reiniciar" title="Empezar este módulo desde el paso 1">Reiniciar</button>
      <!-- Confirmación en la propia barra (la clase .confirmando la enseña), no un diálogo del sistema -->
      <span class="pregunta ro">▸ ¿Borrar lo hecho en este módulo?</span>
      <button id="si-reiniciar">Sí, reiniciar</button>
      <button id="no-reiniciar">No</button>
    </div>

    <span class="et ro" id="haz">▸ Haz esto en Live</span>
    <span id="titulo"></span>
    <!-- El espejo: el trozo de Live donde se actúa (FDR-002). Gris = lo que hay, rojo = dónde tocar, amarillo = objetivo. -->
    <div id="espejo" class="espejo" hidden>
      <span class="zona"><b>Live</b><span id="zona-live"></span></span>
      <div id="dibujo"></div>
      <div id="globo" class="globo"></div>
    </div>

    <p id="instruccion"></p>
    <p id="resultado"></p>
  </div>

  <div class="pie"><span id="live">Live</span><span id="progreso-modulo"></span></div>

  <script src="panel.js"></script>
</body>
</html>
